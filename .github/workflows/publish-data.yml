name: Publish verified AI4MARS data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ai4mars-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and publish the official dataset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -u scripts/publish_release.py
